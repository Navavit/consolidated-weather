# ฟอร์มเพิ่ม/แก้/ลบตำแหน่งจากหน้าเว็บ GitHub (แท็บ Actions → ตั้งค่าตำแหน่ง → Run workflow)
# ใช้จากมือถือได้ โดยก๊อปพิกัดหรือลิงก์จาก Google Maps มาวาง
name: ตั้งค่าตำแหน่ง

on:
  workflow_dispatch:
    inputs:
      action:
        description: "ทำอะไร"
        type: choice
        options:
          - เพิ่มตำแหน่งที่ต้องการ
          - ตั้งเป็นตำแหน่งของฉัน
          - ลบตำแหน่ง
      name:
        description: "ชื่อ เช่น บ้าน, ที่ทำงาน (ถ้าลบ ให้ใส่ชื่อที่จะลบ)"
        required: false
      coords:
        description: "พิกัด '13.7563, 100.5018' หรือลิงก์ Google Maps หรือชื่อสถานที่ (ไม่ต้องใส่ถ้าลบ)"
        required: false

permissions:
  contents: write

concurrency:
  group: config
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: แก้ config.json
        env:                           # ส่งผ่าน env เพื่อกันข้อความแปลก ๆ ถูกตีความเป็นคำสั่ง shell
          ACTION: ${{ inputs.action }}
          NAME: ${{ inputs.name }}
          COORDS: ${{ inputs.coords }}
        run: |
          case "$ACTION" in
            "ตั้งเป็นตำแหน่งของฉัน") A=me ;;
            "ลบตำแหน่ง") A=remove ;;
            *) A=add ;;
          esac
          python collector.py location --action "$A" --name "$NAME" --coords "$COORDS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: บันทึก
        env:
          ACTION: ${{ inputs.action }}
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          if git diff --cached --quiet; then echo "ไม่มีการเปลี่ยนแปลง"; exit 0; fi
          git commit -qm "location: $ACTION $NAME"
          for i in 1 2 3; do
            git push -q && exit 0
            git pull -q --rebase
          done
          exit 1
