# ดึงพยากรณ์ทุกตำแหน่งใน config.json ทุกชั่วโมง
#   1) เก็บเป็นไฟล์ .csv.gz ใน branch "data" (ดึงลงเครื่องด้วย: python3 collector.py sync)
#   2) สร้างหน้าเว็บแล้ว deploy ขึ้น GitHub Pages
#
# GitHub มักข้ามรอบตามตารางเมื่อเครื่องแน่น (เคยห่างกัน 4–7 ชม.) จึงตั้งไว้ 2 เวลาต่อชั่วโมง
# และให้บริการภายนอก (cron-job.org) สั่งรันผ่าน API ด้วย (docs/SCHEDULER.md)
# รอบที่ห่างจากรอบที่สำเร็จก่อนหน้า < 40 นาทีจะข้ามเอง ไม่เปลืองโควตา Open-Meteo/Google
name: ดึงพยากรณ์อัตโนมัติ

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:              # กดรันเองได้จากแท็บ Actions / cron-job.org
    inputs:
      force:
        description: "รันแม้เพิ่งรันไปไม่ถึง 40 นาที"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-branch              # ไม่ให้สองรอบเขียน branch data พร้อมกัน
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skip: ${{ steps.gap.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - name: เตรียม branch data
        run: scripts/data_worktree.sh

      - name: ข้ามถ้าเพิ่งรันไป
        id: gap
        run: |
          last=$(cat archive/last_run.txt 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ "${{ inputs.force }}" != "true" ] && [ $((now - last)) -lt 2400 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "รอบก่อนเพิ่งรันไป $(((now - last) / 60)) นาที ข้ามรอบนี้"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gap.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.gap.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: ดึงข้อมูล
        if: steps.gap.outputs.skip != 'true'
        env:
          TMD_NWP_TOKEN: ${{ secrets.TMD_NWP_TOKEN }}
          GOOGLE_WEATHER_API_KEY: ${{ secrets.GOOGLE_WEATHER_API_KEY }}   # ว่างได้ ถ้ายังไม่ตั้ง จะข้าม Google
        run: |
          python collector.py run --export-dir archive --no-db --site-dir site
          date +%s > archive/last_run.txt

      - name: บันทึกลง branch data
        if: (success() || failure()) && steps.gap.outputs.skip != 'true'   # บางตำแหน่งล้มเหลว ยังเก็บที่สำเร็จไว้
        run: scripts/push_data.sh data

      - name: อัปโหลดหน้าเว็บ
        if: (success() || failure()) && steps.gap.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: collect
    if: (success() || failure()) && needs.collect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
