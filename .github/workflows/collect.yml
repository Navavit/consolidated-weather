# ดึงพยากรณ์ทุกตำแหน่งใน config.json ทุกชั่วโมง แล้วเก็บเป็นไฟล์ .csv.gz ใน branch "data"
# ดึงลงเครื่องด้วย: python3 collector.py sync
name: ดึงพยากรณ์อัตโนมัติ

on:
  schedule:
    - cron: "7 * * * *"          # ทุกชั่วโมง นาทีที่ 7 (เลี่ยงต้นชั่วโมงที่คิว GitHub แน่น อาจช้ากว่านี้ 5–30 นาที)
  workflow_dispatch:              # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

concurrency:
  group: data-branch              # ไม่ให้สองรอบเขียน branch data พร้อมกัน
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: เตรียม branch data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach archive FETCH_HEAD
          else
            git worktree add --detach archive HEAD
            cd archive && git checkout -q --orphan data && git rm -rfq . && cd ..
          fi

      - name: ดึงข้อมูล
        env:
          TMD_NWP_TOKEN: ${{ secrets.TMD_NWP_TOKEN }}
        run: python collector.py run --export-dir archive --no-db

      - name: บันทึกลง branch data
        if: success() || failure()     # ถ้าบางตำแหน่งล้มเหลว ยังเก็บตำแหน่งที่สำเร็จไว้
        run: |
          cd archive
          git add -A
          if git diff --cached --quiet; then echo "ไม่มีข้อมูลใหม่"; exit 0; fi
          git commit -qm "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q origin HEAD:data && exit 0
            git pull -q --rebase origin data
          done
          exit 1
