# ดึงพยากรณ์ทุกตำแหน่งใน config.json ทุกชั่วโมง
#   1) เก็บเป็นไฟล์ .csv.gz ใน branch "data" (ดึงลงเครื่องด้วย: python3 collector.py sync)
#   2) สร้างหน้าเว็บแล้ว deploy ขึ้น GitHub Pages
name: ดึงพยากรณ์อัตโนมัติ

on:
  schedule:
    - cron: "7 * * * *"          # ทุกชั่วโมง นาทีที่ 7 (เลี่ยงต้นชั่วโมงที่คิว GitHub แน่น อาจช้ากว่านี้ 5–30 นาที)
  workflow_dispatch:              # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-branch              # ไม่ให้สองรอบเขียน branch data พร้อมกัน
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: เตรียม branch data
        run: scripts/data_worktree.sh

      - name: ดึงข้อมูล
        env:
          TMD_NWP_TOKEN: ${{ secrets.TMD_NWP_TOKEN }}
          GOOGLE_WEATHER_API_KEY: ${{ secrets.GOOGLE_WEATHER_API_KEY }}   # ว่างได้ ถ้ายังไม่ตั้ง จะข้าม Google
        run: python collector.py run --export-dir archive --no-db --site-dir site

      - name: บันทึกลง branch data
        if: success() || failure()     # ถ้าบางตำแหน่งล้มเหลว ยังเก็บตำแหน่งที่สำเร็จไว้
        run: scripts/push_data.sh data

      - name: อัปโหลดหน้าเว็บ
        if: success() || failure()
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: collect
    if: success() || failure()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
